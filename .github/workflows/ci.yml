name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tip kontrolü, birim ve API testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Tip kontrolü
        run: npm run lint
      - name: API ve web birim testleri
        run: npm test
      - name: Tasarım token kontrastı (WCAG 2.2 AA)
        run: npm run check:contrast
      - name: Üretim derlemesi
        run: npm run build

  e2e:
    name: Uçtan uca kabul testleri (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-raporu
          path: apps/web/playwright-report
          retention-days: 14
